<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicie sessão na sua conta Microsoft</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="microsoft-body">
    <div class="ms-login-container">
        <div class="ms-card">
            <div class="ms-logo">
                <div class="ms-logo-tile t1"></div>
                <div class="ms-logo-tile t2"></div>
                <div class="ms-logo-tile t3"></div>
                <div class="ms-logo-tile t4"></div>
            </div>
            
            <div class="ms-title">Introduzir palavra-passe</div>
            <div class="ms-identity-pill">
                <span>{{ employee.email }}</span>
            </div>

            <form action="{{ url_for('phishing.mock_login', employee_id=employee.id) }}" method="POST">
                <div class="ms-form-group">
                    <input type="password" id="password" name="password" class="ms-input" placeholder="Palavra-passe" required autofocus>
                </div>

                <div class="ms-links-row">
                    <a href="#" class="ms-link">Esqueceu-se da palavra-passe?</a>
                </div>

                <div class="ms-btn-row">
                    <button type="submit" class="ms-btn-primary">Iniciar sessão</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="ms-footer">
        <a href="#">Termos de utilização</a>
        <a href="#">Privacidade e cookies</a>
        <span>...</span>
    </footer>
</body>
</html>
